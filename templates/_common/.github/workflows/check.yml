name: 'Check'

on: [pull_request]

jobs:
  lint:
    name: 'Check'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        id: checks
        run: npm run check || exit 0

      - name: Push Autofixes
        run: |-
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Lint autofix" || exit 0
          git push

      - name: Create Unfixables Types Report
        id: report-types
        run: |
          report=$(npm run check:types || exit 0)
          echo "$report" > types_report.txt
          echo "::set-output name=REPORT::$report"

      - name: Create Unfixables Scripts Report
        id: report-scripts
        run: |
          report=$(npm run check:scripts || exit 0)
          echo "$report" > scripts_report.txt
          echo "::set-output name=REPORT::$report"

      - name: Create Unfixables Format Report
        id: report-format
        run: |
          report=$(npm run check:format || exit 0)
          echo "$report" > format_report.txt
          echo "::set-output name=REPORT::$report"

      - name: Add comment
        id: comment
        uses: actions/github-script@v3
        env:
          TYPES_REPORT: '${{ steps.report-types.outputs.REPORT }}'
          SCRIPTS_REPORT: '${{ steps.report-scripts.outputs.REPORT }}'
          FORMAT_REPORT: '${{ steps.report-format.outputs.REPORT }}'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            function getReport(filePath) {
              try {
                const content = fs.readFileSync(filePath, 'utf8').trim();
                return content.split("\n").length > 2 ? content : "";
              } catch (err) {
                return "";
              }
            }

            const typesReport = getReport('types_report.txt');
            const scriptsReport = getReport('scripts_report.txt');
            const formatReport = getReport('format_report.txt');

            let output = "## Linting, Formatting & Testing Report\n\n";

            if (typesReport) {
              output += `### Types Report\n\`\`\`\n${typesReport}\n\`\`\`\n\n`;
            }
            if (scriptsReport) {
              output += `### Scripts Report\n\`\`\`\n${scriptsReport}\n\`\`\`\n\n`;
            }
            if (formatReport) {
              output += `### Formatting Report\n\`\`\`\n${formatReport}\n\`\`\`\n\n`;
            }

            if (output.trim() !== "## Linting, Formatting & Testing Report") {
              github.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            }
